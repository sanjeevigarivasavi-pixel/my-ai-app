<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e1e1e; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    #key-bar { background: #1a1a1a; padding: 10px 16px; display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #262626; color: #fff; font-size: 14px; }
    button { padding: 10px 16px; border-radius: 8px; border: none; background: #4f46e5; color: #fff; font-weight: bold; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; font-size: 15px; }
    .user { background: #4f46e5; align-self: flex-end; }
    .ai { background: #262626; align-self: flex-start; border: 1px solid #333; }
    footer { padding: 10px 16px; background: #1e1e1e; display: flex; gap: 8px; border-top: 1px solid #333; }
  </style>
</head>
<body>
  <header><strong>✨ My AI Assistant</strong><button onclick="clearChat()" style="background:#333;padding:6px 10px;font-size:12px;">Clear</button></header>
  <div id="key-bar"><input id="apiKey" type="password" placeholder="Paste Google AI Studio API Key..."></div>
  <div id="chat"></div>
  <footer><input id="prompt" placeholder="Edaina adugu..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></footer>

  <script>
    let history = [];
    const chat = document.getElementById('chat');
    const keyInput = document.getElementById('apiKey');
    keyInput.value = localStorage.getItem('gemini_key') || '';
    keyInput.oninput = () => localStorage.setItem('gemini_key', keyInput.value.trim());

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function clearChat() { history = []; chat.innerHTML = ''; }

    const MODELS = ['gemini-4-hydrogen'];

    async function callGemini(key, onStatus) {
      let last = null;
      for (const model of MODELS) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const res = await fetch(
            'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key),
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: history })
            }
          );
          const data = await res.json();
          if (res.ok) return data;
          last = { status: res.status, data };

          const busy = [429, 500, 503].includes(res.status) ||
            /demand|overloaded|unavailable/i.test(data.error?.message || '');
          if (!busy) return data;

          onStatus('Busy (' + res.status + '), retry ' + (attempt + 1) + '... ' + model);
          await new Promise(r => setTimeout(r, 1000 * 2 ** attempt));
        }
      }
      return { error: { message: 'Busy (' + (last?.status || '?') + '): ' + (last?.data?.error?.message || 'Konchem sepu tarvata try cheyandi.') } };
    }

    async function send() {
      const key = keyInput.value.trim();
      const input = document.getElementById('prompt');
      const text = input.value.trim();
      if (!key) return alert('Paina API Key paste cheyi!');
      if (!text) return;

      input.value = '';
      addMsg(text, 'user');
      const loading = addMsg('Thinking...
